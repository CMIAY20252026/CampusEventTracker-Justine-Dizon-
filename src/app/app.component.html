<div class="app-container">
  <!-- Header Section -->
  <header class="app-header">
    <h1>{{ name }} Campus Event Tracker</h1>
    <p>Keep track of all your campus events easily!</p>
  </header>

  <!-- Event Tracker Card -->
  <section class="tracker-card">
    <!-- Card Header -->
    <div class="card-header">
      <span class="material-icons event-icon">event</span>
      <h2>My Events</h2>
      <p>Add new events and view your saved events below.</p>
    </div>

    <!-- Tracker Component -->
    <div class="card-content">
      <app-event-tracker></app-event-tracker>
    </div>
  </section>

  <!-- Footer -->
  <footer class="app-footer">
    &copy; 2025 Campus Event Tracker. All rights reserved.
  </footer>
</div>
